# Parâmetros do pipeline — Art. 3 (Ambiente & Sociedade)
# Externalização do dicionário CFG do notebook v4.2.
# Valores refletem a execução que gerou os resultados do manuscrito,
# salvo onde marcado PREENCHER.

paths:
  # Relativos à raiz do repositório, resolvida automaticamente pela célula 0.
  # Para executar a partir de outro diretório, defina AMBSOC_REPO_ROOT.
  root: "./"
  data_raw: "data/raw"
  data_processed: "data/processed"
  outputs: "outputs"

temporalidade:
  main_schema: "pre_renovabio_1985_2015"

buffers:
  # ESCALA PRINCIPAL: 25 km.
  # O modelo completo principal usa o buffer de 25 km, em razão da
  # disponibilidade de cache completo para fronteira, topografia e uso
  # anterior. Os caches exatos publicados em outputs/tables/ correspondem
  # a esta escala (buffer_km = 25).
  main_buffer_km: 25
  legacy_buffer_km: 25

  # Robustez multiescala: 30, 50, 100 e 150 km, estimados por aproximação
  # a partir da grade espacial de 50 km usada nas exportações do GEE.
  # Ver o parâmetro build_approx_frontier_from_origin_grid abaixo.
  buffer_candidates_km: [25, 30, 50, 100, 150]
  # Substituição do buffer PRINCIPAL por outro, caso seu cache não exista.
  # Mantido em false: a ausência do cache principal deve interromper a
  # execução, não ser silenciosamente contornada. Com main_buffer_km = 25,
  # o cache existe e este parâmetro não tem efeito prático.
  fallback_to_available_buffer: false

  # Construção dos buffers de ROBUSTEZ (30, 50, 100 e 150 km) por aproximação
  # a partir da grade de origem. Este é o método declarado no manuscrito, não
  # um contorno: os caches exatos existem apenas para 25 km.
  # Ausências são registradas em outputs/robustness/missing_*.csv.
  build_approx_frontier_from_origin_grid: true
  prefer_exact_frontier_cache: true
  run_m3_in_buffer_robustness: true

uso_anterior:
  origin_model_year_min: 1987
  origin_model_year_max: 2015
  run_unit_origin_approximation_from_grid: true
  n_boot_origin: 1500
  origin_seed: 20260609
  save_origin_draws: true

pesos_espaciais:
  k_neighbors: 6
  k_neighbors_robustness: [4, 6, 8, 10]
  permutations: 999
  fdr_alpha: 0.05
  # Semente da inferência por permutação (Moran global e LISA).
  # O RNG do esda é global; sem semeadura os p-valores variam entre execuções.
  # A célula 0 do notebook define seed_spatial_inference(), chamada antes de
  # cada estimativa, com offset derivado de k para manter independência.
  spatial_seed: 20260609

crs:
  # Sistema de coordenadas das colunas X/Y das usinas. DECLARADO, não inferido.
  #
  # Verificação: os limites observados (X 4.435.218–6.176.905;
  # Y 7.359.058–8.620.088), interpretados em EPSG:5880, correspondem a
  # lon -59,5 a -43,2 e lat -23,8 a -12,3 — o recorte Centro-Sul. Registro
  # original em outputs/diagnostics/diagnostico_crs_coordenadas_usinas.csv
  # (228 unidades).
  unit_coord_crs: "EPSG:5880"
  # CRS projetado usado no diagnóstico Moran/LISA
  analysis_crs: "EPSG:5880"

exportacao:
  figure_dpi: 600
  save_svg: true
  idiomas: ["ptbr", "en"]
